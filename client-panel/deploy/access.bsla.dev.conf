
# HTTP origin - do NOT force redirect here.
# This avoids Cloudflare/Flexible SSL redirect loops.

server {

    listen 80;

    server_name access.bsla.dev localhost 127.0.0.1;



    client_max_body_size 10M;


    location = /admin {

        return 301 /admin/;

    }



    location ^~ /admin/ {

        # Important: trailing slash strips /admin/ before sending to the app.

        # /admin/login    -> http://127.0.0.1:8090/login

        # /admin/settings -> http://127.0.0.1:8090/settings

        proxy_pass http://127.0.0.1:8090/;

        proxy_http_version 1.1;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;



        proxy_redirect off;

        proxy_buffering off;

    }





    location / {

        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;



        # Important for apps behind HTTPS proxy

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;



        proxy_buffering off;

    }

}



# Direct HTTPS origin

server {

    listen 443 ssl;

    server_name access.bsla.dev localhost 127.0.0.1;



    ssl_certificate /etc/letsencrypt/live/access.bsla.dev/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/access.bsla.dev/privkey.pem;



    client_max_body_size 10M;


    location = /admin {

        return 301 /admin/;

    }



    location ^~ /admin/ {

        # Important: trailing slash strips /admin/ before sending to the app.

        # /admin/login    -> http://127.0.0.1:8090/login

        # /admin/settings -> http://127.0.0.1:8090/settings

        proxy_pass http://127.0.0.1:8090/;

        proxy_http_version 1.1;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;



        proxy_redirect off;

        proxy_buffering off;

    }





    location / {

        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;



        proxy_buffering off;

    }

}
